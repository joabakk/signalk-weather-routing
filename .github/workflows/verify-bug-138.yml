# Throwaway verification for BUG-138 (fork only): mirrors the Signal K plugin registry's
# test step — install with --ignore-scripts, build, test — on code before and after the fix.
name: Verify BUG-138
on:
  push:
    branches: [verify/BUG-138]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registry-like-test:
    name: ${{ matrix.label }} on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        label: [before-fix-expect-fail, after-fix-expect-pass]
        include:
          - label: before-fix-expect-fail
            ref: a69fc1bba9eab35d348ecd5991d60a718c44418a
          - label: after-fix-expect-pass
            ref: cfecfeefad4d498130a742864f8618d42d0299ba
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install like the registry
        run: npm ci --ignore-scripts || npm install --ignore-scripts
      - name: Show gdal-async binding dir before tests
        run: ls -la node_modules/gdal-async/lib/binding 2>&1 || true
      - run: npm run build
      - run: npm test
      - name: Show gdal-async binding dir after tests
        if: always()
        run: ls -la node_modules/gdal-async/lib/binding/*/ 2>&1 || true

  # Follows DEVELOPMENT.md "Install / full rebuild" inside the official Signal K server image,
  # then checks the plugin starts and gdal-async works at runtime, and runs the suite in-container.
  docker-deploy:
    name: docker ${{ matrix.label }} on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        label: [before-fix, after-fix]
        include:
          - label: before-fix
            ref: a69fc1bba9eab35d348ecd5991d60a718c44418a
          - label: after-fix
            ref: cfecfeefad4d498130a742864f8618d42d0299ba
    env:
      CONF: ${{ github.workspace }}/signalk_conf
      PLUGIN_URL: http://localhost:3000/plugins/signalk-weather-routing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
          path: plugin-src
      - name: Start signalk-server container
        run: |
          mkdir -p "$CONF" && chmod 777 "$CONF"
          docker run -d --name signalk-server -p 3000:3000 \
            -e DEBUG=signalk-weather-routing,signalk-server:interfaces:plugins \
            -v "$CONF:/home/node/.signalk" signalk/signalk-server:latest
          for i in $(seq 1 60); do curl -sf http://localhost:3000/signalk >/dev/null && break; sleep 2; done
          curl -sf http://localhost:3000/signalk
          docker exec signalk-server node -v
      - name: Create a throwaway admin user (random per-run password, masked)
        run: |
          PW=$(openssl rand -hex 24)
          echo "::add-mask::$PW"
          umask 077 && printf '%s' "$PW" > "$RUNNER_TEMP/sk-pw"
          printf '{"userId":"ci-admin","password":"%s","type":"admin"}' "$PW" | \
            curl -sf -X POST -H 'Content-Type: application/json' --data-binary @- \
              http://localhost:3000/skServer/enableSecurity
          echo
      - name: "DEVELOPMENT.md step 1: copy source into the bind-mounted volume"
        run: |
          cp -r plugin-src "$CONF/_weather-routing-src"
          chmod -R a+rwX "$CONF/_weather-routing-src"
      - name: "DEVELOPMENT.md step 2: npm install, build, pack"
        run: |
          docker exec signalk-server sh -c \
            "cd /home/node/.signalk/_weather-routing-src && \
             npm install && \
             npm run build && \
             npm pack --ignore-scripts"
      - name: "DEVELOPMENT.md step 3: install from the tarball with --ignore-scripts"
        run: |
          docker exec signalk-server sh -c \
            "cd /home/node/.signalk && \
             npm install --ignore-scripts ./_weather-routing-src/signalk-weather-routing-*.tgz"
          echo "binding dir right after install (expected empty/missing):"
          docker exec signalk-server sh -c \
            "ls -la /home/node/.signalk/node_modules/signalk-weather-routing/node_modules/gdal-async/lib/binding /home/node/.signalk/node_modules/gdal-async/lib/binding 2>&1" || true
      - name: Keep a source copy for the in-container test run, then step 4 cleanup
        run: |
          cp -r plugin-src "$CONF/_wr-test-src" && chmod -R a+rwX "$CONF/_wr-test-src"
          docker exec signalk-server sh -c "rm -rf /home/node/.signalk/_weather-routing-src"
      - name: Configure and enable the plugin with test polar + GRIB
        run: |
          mkdir -p "$CONF/wr-test/grib"
          cp plugin-src/test-data/sunwind33.pol "$CONF/wr-test/"
          cp plugin-src/test-data/Denmark_ICON_EU_EWAM_20260606-00.grb2 "$CONF/wr-test/grib/"
          chmod -R a+rwX "$CONF/wr-test"
          # plugin-config-data is created by the server as the container user; write it from inside
          echo '{"enabled": true, "configuration": {"polarPath": "/home/node/.signalk/wr-test/sunwind33.pol", "gribDir": "/home/node/.signalk/wr-test/grib"}}' | \
            docker exec -i signalk-server sh -c \
              "mkdir -p /home/node/.signalk/plugin-config-data && cat > /home/node/.signalk/plugin-config-data/signalk-weather-routing.json"
      - name: "DEVELOPMENT.md step 5: restart Signal K"
        run: |
          docker restart signalk-server
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:3000/signalk && break; sleep 2; done
          sleep 30
      - name: Plugin endpoints respond and gdal-async indexed the GRIB (via HTTP, logged in)
        run: |
          printf '{"username":"ci-admin","password":"%s"}' "$(cat "$RUNNER_TEMP/sk-pw")" | \
            curl -sf -c "$RUNNER_TEMP/cj" -o /dev/null -X POST -H 'Content-Type: application/json' \
              --data-binary @- http://localhost:3000/signalk/v1/auth/login
          get() { curl -sf -b "$RUNNER_TEMP/cj" "$@"; }
          echo "--- /status"; get "$PLUGIN_URL/status"; echo
          for i in $(seq 1 60); do
            n=$(get "$PLUGIN_URL/grib-info" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log(j.files.length+j.currentFiles.length)})')
            [ "${n:-0}" -ge 1 ] && break; sleep 2
          done
          echo "--- /grib-info"; get "$PLUGIN_URL/grib-info" | tee grib-info.json; echo
          node -e 'const j=require("./grib-info.json"); if (j.files.length+j.currentFiles.length<1 || j.failedFiles.length) { console.error("GRIB not indexed:", JSON.stringify(j.failedFiles)); process.exit(1) }'
          echo "--- /skServer/plugins entry"
          get http://localhost:3000/skServer/plugins | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s).find(p=>p.id==="signalk-weather-routing"); if(!p){console.error("plugin not listed");process.exit(1)} console.log(JSON.stringify({id:p.id,version:p.version,enabled:p.data&&p.data.enabled})); if(!p.data.enabled) process.exit(1)})'
      - name: Plugin started and gdal-async works at runtime (checked inside the container)
        run: |
          echo "--- plugin log lines"
          docker logs signalk-server 2>&1 | grep -iE "weather-routing|gdal" | tail -40
          if docker logs signalk-server 2>&1 | grep -iE "weather-routing" | grep -iE "error|cannot find module|failed"; then
            echo "plugin reported an error"; exit 1
          fi
          echo "--- gdal-async binding after plugin start (copied by ensureGdalBinary)"
          docker exec signalk-server sh -c "ls -la /home/node/.signalk/node_modules/gdal-async/lib/binding/*/gdal.node"
          echo "--- installed plugin reads the test GRIB through gdal-async"
          docker exec signalk-server node -e '
            const g = require("/home/node/.signalk/node_modules/signalk-weather-routing/dist/lib/grib.js");
            g.readGribMeta("/home/node/.signalk/wr-test/grib/Denmark_ICON_EU_EWAM_20260606-00.grb2")
              .then((m) => console.log(JSON.stringify(m).slice(0, 400)))
              .catch((e) => { console.error(e); process.exit(1); });'
      - name: Plugin's own tests inside the container, registry-style install
        run: |
          docker exec signalk-server sh -c \
            "cd /home/node/.signalk/_wr-test-src && \
             npm install --ignore-scripts && \
             npm run build && \
             npm test"
      - name: Server log
        if: always()
        run: docker logs signalk-server 2>&1 | grep -iE "weather|gdal|error|fail" | tail -60
